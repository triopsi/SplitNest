name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend-Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node.js 22 einrichten
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Abhängigkeiten installieren
        run: npm ci --no-audit --no-fund

      - name: Assets bauen
        run: npm run build

  docker:
    name: Docker-Image (Test-Build)
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Image bauen (ohne Push)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
