name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Existing release version to publish as version and latest (without v)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Semantic Release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Auf Docker Hub und GHCR veröffentlichen
    needs: release
    if: always() && (needs.release.outputs.published == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_VERSION: ${{ inputs.version || needs.release.outputs.version }}
    steps:
      - name: Release-Version prüfen
        shell: bash
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Provide an existing stable release version, for example 1.2.3 (without v)."
            exit 1
          fi

      - name: Checkout (Release-Tag)
        uses: actions/checkout@v7
        with:
          ref: v${{ env.RELEASE_VERSION }}

      - name: QEMU einrichten
        uses: docker/setup-qemu-action@v4

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v4

      - name: Bei Docker Hub anmelden
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Bei GitHub Container Registry anmelden
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image bauen und in beide Registries pushen
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          platforms: linux/amd64,linux/arm64
          pull: true
          no-cache: true
          push: true
          build-args: |
            APP_VERSION=${{ env.RELEASE_VERSION }}
          tags: |
            triopsi/splitnest:${{ env.RELEASE_VERSION }}
            triopsi/splitnest:latest
            ghcr.io/triopsi/splitnest:${{ env.RELEASE_VERSION }}
            ghcr.io/triopsi/splitnest:latest
          labels: |
            org.opencontainers.image.title=SplitNest
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.RELEASE_VERSION }}
            org.opencontainers.image.licenses=MIT
