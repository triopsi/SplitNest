name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pint:
    name: Code Style (Pint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: PHP 8.4 einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, gd, intl, mbstring, pdo_sqlite, zip
          coverage: none

      - name: Abhängigkeiten installieren
        run: composer install --no-interaction --prefer-dist

      - name: Pint ausführen
        run: vendor/bin/pint --test

      - name: PHPDocs prüfen
        run: php scripts/check-phpdocs.php

  phpunit:
    name: Unit- & Feature-Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: PHP 8.4 einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, gd, intl, mbstring, pdo_sqlite, zip
          coverage: none

      - name: Abhängigkeiten installieren
        run: composer install --no-interaction --prefer-dist

      - name: Umgebung vorbereiten
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Tests ausführen
        run: php artisan test

  gitleaks:
    name: Secret-Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Gitleaks ausführen
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
