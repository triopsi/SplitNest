services:
  app:
    build:
      context: .
      target: development
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    volumes:
      - .:/var/www/html
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: household
      DB_USERNAME: household
      DB_PASSWORD: local-development-only
      APP_URL: http://localhost:${APP_PORT:-8080}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: household
      POSTGRES_USER: household
      POSTGRES_PASSWORD: local-development-only
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U household -d household"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  database:
